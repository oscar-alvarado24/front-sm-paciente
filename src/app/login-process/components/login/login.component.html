<section>
    <div class="container position-relative w-50 float-left login_section">

        <div *ngIf="currentState === 'INITIAL'">
            <app-initial-form (currentStateEmitter)="onCurrentState($event)" (qrInscriptionEmitter)="onSharedSecret($event)"></app-initial-form>
        </div>

        <div *ngIf="currentState === 'NEW_PASSWORD_REQUIRED'">
            <app-change-origin-password (sharedSecretEmmiter)="onSharedSecret($event)" (currentStateEmitter)="onCurrentState($event)"></app-change-origin-password>
        </div>

        <!-- Sección del código QR  -->
        <div *ngIf="currentState === 'VIEW QR'" class="col">
            <app-qr-code (currentStateEmitter)="onCurrentState($event)" [sharedSecret]="sharedSecret" ></app-qr-code>
        </div>

        <div *ngIf="currentState === 'VIEW QR' || currentState === 'SEND TOTP CODE'">
            <app-totp-code-process (currentStateEmmiter)="onCurrentState($event)" (totpProcessSuccessfulEmitter)="onTotpProcessSuccessful($event)"></app-totp-code-process>
        </div>
    </div>
    <div *ngIf="showSpinner">
        <app-loading-spinner></app-loading-spinner>
    </div>
</section>
