<section class="principal">
    <div class="perfil-menu-container">
        <!-- Input file oculto -->
        <input class="hidden_input" #fileInput type="file" accept="image/*" aria-label="Seleccionar imagen para subir"
            (change)="onFileSelected($event)">

        <!-- Contenedor del avatar -->
        <div class="avatar-container">
            <!-- Círculo del avatar -->
            <div class="avatar-circle">
                <img *ngIf="imagenPerfil" [src]="imagenPerfil" alt="Avatar" class="avatar-image">
                <div *ngIf="!imagenPerfil" class="avatar-placeholder"></div>
            </div>

            <!-- Botón de editar - solo el ícono del lápiz -->
            <button class="avatar-editar" (click)="seleccionarImagen(); $event.stopPropagation();">
                <i class="material-icons">edit</i>
            </button>
        </div>

        <div class="menu" role="menu" aria-label="Menú izquierdo de usuario">
            <div class="perfil-menu-container">
                <div class="session-info-container">
                    <!-- Fecha de última sesión -->
                    <div class="session-title">última sesión</div>

                    <div class="session-info" *ngIf="sessionInfo">
                        <div class="info-row">
                            <svg class="icon clock-icon" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" />
                                <path d="m12 6 0 6 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" fill="none" />
                            </svg>
                            <div class="info-text">{{date}}</div>
                        </div>

                        <div class="info-row">
                            <svg class="icon router-icon" viewBox="0 0 24 24">
                                <!-- Antena izquierda -->
                                <path d="M6 4v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                                <!-- Antena derecha -->
                                <path d="M18 4v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                                <!-- Cuerpo del router -->
                                <rect x="4" y="10" width="16" height="6" rx="2" stroke="currentColor" stroke-width="2"
                                    fill="none" />
                                <!-- Indicadores LED -->
                                <circle cx="8" cy="13" r="1" fill="currentColor" />
                                <circle cx="12" cy="13" r="1" fill="currentColor" />
                                <circle cx="16" cy="13" r="1" fill="currentColor" />
                            </svg>
                            <div class="info-text">{{ip}}</div>
                        </div>

                        <div class="info-row">
                            <svg class="icon globe-icon" viewBox="0 0 24 24">
                                <!-- Círculo principal -->
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" />

                                <!-- Meridiano central -->
                                <path d="M12 2C12 2 8 6 8 12s4 10 4 10" stroke="currentColor" stroke-width="1.5"
                                    fill="none" />
                                <path d="M12 2C12 2 16 6 16 12s-4 10-4 10" stroke="currentColor" stroke-width="1.5"
                                    fill="none" />

                                <!-- Ecuador y paralelos -->
                                <path d="M2 12h20" stroke="currentColor" stroke-width="1.5" />
                                <path d="M4.5 8h15" stroke="currentColor" stroke-width="1" opacity="0.6" />
                                <path d="M4.5 16h15" stroke="currentColor" stroke-width="1" opacity="0.6" />
                            </svg>
                            <div class="info-text">{{location}}</div>
                        </div>
                    </div>
                    <div class="info-text message" *ngIf="!sessionInfo && sessionValue">
                        <p>{{sessionValue}}</p>
                    </div>
                    <div class="info-text message" *ngIf="!sessionInfo && !sessionValue">
                        <p>No hay información de sesión disponible</p>
                    </div>
                </div>
                <div class="menu-item" (click)="viewProfile()" (keydown.enter)="viewProfile()"
                    (keydown.space)="viewProfile()" tabindex="0" role="menuitem">
                    Perfil
                </div>
                <div class="menu-item" (click)="changePassword()" (keydown.enter)="changePassword()"
                    (keydown.space)="changePassword()" tabindex="0" role="menuitem">
                    Cambiar contraseña
                </div>
                <div class="menu-item" (click)="logOut()" (keydown.enter)="logOut()" (keydown.space)="logOut()"
                    tabindex="0" role="menuitem">
                    Cerrar sesión
                </div>
            </div>
        </div>
    </div>
</section>
