<section>
    <div class="upcoming-procedures">
        <h2>Próximos Procedimientos ({{ upcomingProcedures.length }})</h2>
        <div *ngIf="upcomingProcedures.length > 0 && !messageUpcomingProcedures" class="cards-grid">
            <app-procedures-target *ngFor="let cita of upcomingProcedures" [procedureData]="cita" [isUpcoming]="true">
            </app-procedures-target>
        </div>
        <div *ngIf="upcomingProcedures.length === 0 && messageUpcomingProcedures" class="empty-state">
            <p>{{messageUpcomingProcedures}}</p>
        </div>
    </div>

    <div class="last-procedures">
        <h2>Procedimientos Anteriores ({{ previousProcedures.length }})</h2>
        <div *ngIf="previousProcedures.length > 0 && !messagePreviousProcedures" class="cards-grid">
            <app-procedures-target *ngFor="let cita of previousProcedures" [procedureData]="cita" [isUpcoming]="false">
            </app-procedures-target>
        </div>
        <div *ngIf="previousProcedures.length === 0 && messagePreviousProcedures" class="empty-state">
            <p>{{messagePreviousProcedures}}</p>
        </div>
    </div>
</section>
