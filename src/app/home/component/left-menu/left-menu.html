<section class="principal">
  <div class="perfil-menu-container">
    <!-- Input file oculto -->
    <input
      class="hidden-input"
      #fileInput
      type="file"
      accept="image/*"
      aria-label="Seleccionar imagen para subir"
      (change)="onFileSelected($event)"
    />

    <!-- Contenedor del avatar -->
    <div class="avatar-container">
      <div class="avatar-circle">
        @if (imagenPerfil) {
          <img [src]="imagenPerfil" alt="Avatar" class="avatar-image" />
        } @else {
          <div class="avatar-placeholder"></div>
        }
      </div>

      <button
        class="avatar-editar"
        (click)="seleccionarImagen(); $event.stopPropagation()"
        aria-label="Editar foto de perfil"
        type="button"
      >
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
      </button>
    </div>

    <!-- Menú -->
    <nav class="menu" aria-label="Menú izquierdo de usuario">
      <!-- Sección de última sesión -->
      <div class="session-info-container">
        <span class="session-title">Última sesión</span>

        @if (sessionInfo) {
          <div class="session-info">
            <div class="info-row">
              <!-- Icono reloj -->
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" />
                <path
                  d="m12 6 0 6 4 4"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  fill="none"
                />
              </svg>
              <span class="info-text">{{ date }}</span>
            </div>

            <div class="info-row">
              <!-- Icono router -->
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 4v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path d="M18 4v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <rect
                  x="4"
                  y="10"
                  width="16"
                  height="6"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="2"
                  fill="none"
                />
                <circle cx="8" cy="13" r="1" fill="currentColor" />
                <circle cx="12" cy="13" r="1" fill="currentColor" />
                <circle cx="16" cy="13" r="1" fill="currentColor" />
              </svg>
              <span class="info-text">{{ ip }}</span>
            </div>

            <div class="info-row">
              <!-- Icono globo -->
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" />
                <path
                  d="M12 2C12 2 8 6 8 12s4 10 4 10"
                  stroke="currentColor"
                  stroke-width="1.5"
                  fill="none"
                />
                <path
                  d="M12 2C12 2 16 6 16 12s-4 10-4 10"
                  stroke="currentColor"
                  stroke-width="1.5"
                  fill="none"
                />
                <path d="M2 12h20" stroke="currentColor" stroke-width="1.5" />
                <path d="M4.5 8h15" stroke="currentColor" stroke-width="1" opacity="0.6" />
                <path d="M4.5 16h15" stroke="currentColor" stroke-width="1" opacity="0.6" />
              </svg>
              <span class="info-text">{{ location }}</span>
            </div>
          </div>
        } @else if (sessionValue) {
          <p class="info-text info-text--message">{{ sessionValue }}</p>
        } @else {
          <p class="info-text info-text--message">No hay información de sesión disponible</p>
        }
      </div>

      <!-- Items del menú -->
      <button class="menu-item" type="button" (click)="viewProfile()">Perfil</button>

      <button class="menu-item" type="button" (click)="changePassword()">Cambiar contraseña</button>

      <button class="menu-item menu-item--last" type="button" (click)="logOut()">
        Cerrar sesión
      </button>
    </nav>
  </div>
</section>
