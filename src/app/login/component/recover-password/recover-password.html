<section>
  <div class="recover-password-section">
    <app-email
      (emailValid)="onEmailValid($event)"
      (emailValue)="onEmailValue($event)"
    />
    <button (click)="recoverPassword()" [disabled]="!isEmailValid || isLoading()">
      @if (isLoading()) {
        <output class="spinner-border spinner-border-sm" aria-hidden="true"></output>
        Cargando...
      } @else {
        Recuperar contraseña
      }
    </button>
  </div>
</section>
