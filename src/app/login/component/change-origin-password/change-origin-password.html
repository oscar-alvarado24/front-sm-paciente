<section>
  <app-password
    (passwordsValue)="onPasswordsValue($event)"
    (passwordValid)="onPasswordValid($event)"
  ></app-password>
  <button (click)="changePassword()" [disabled]="!arePasswordValid() || isLoading()">
    @if (isLoading()) {
      <output class="spinner-border spinner-border-sm" aria-hidden="true"></output>
      Cargando...
    } @else {
      Cambiar contraseña
    }
  </button>
</section>
